<script>

Abdomen|Crunch en máquina,Crunch en polea,Crunch inverso,Elevación de rodillas en barra,Elevación de piernas colgado,Rotación de tronco en máquina,Leñador en polea,Rueda abdominal de rodillas,Plancha con toque de hombro,Dead bug,Hollow hold,V-ups,Bird dog,Toques de talón,Pallof press,Tijeras abdominales

const EX=[];EXS.split('\n').forEach(l=>{const[t,n]=l.split('|');n.split(',').forEach(x=>EX.push({id:'e'+EX.length,n:x,t}))});
const day=()=>({m:'g',e:[]}),nr=()=>({d:[0,1,2,3,4].map(day),rep:[]}),def=()=>({r:{'Rutina A':nr()},a:'Rutina A',img:{},cx:[],kg:{}});
let S=def(),doc=null,page='wk',tm,tt;const WD=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],TDf=()=>(new Date().getDay()+6)%7;let TD=TDf(),sel=TD<5?TD:null,pk=0;
const all=()=>{const k=Object.keys(TY);return EX.concat(S.cx).sort((a,b)=>k.indexOf(a.t)-k.indexOf(b.t))},by=id=>all().find(e=>e.id==id)||{n:'(eliminado)',t:'Propio'};

let LI={};try{LI=JSON.parse(localStorage.getItem('gym-i')||'{}')}catch(e){}

const save=()=>{try{localStorage.setItem('gym-s',JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(()=>doc&&doc.set({j:JSON.stringify(S)}).catch(()=>msg('No se pudo guardar')),300)};
const im=e=>(S.img[e.id]||LI[e.id])?`<img src="${S.img[e.id]||LI[e.id]}" alt="">`:`<div class=ph>${TY[e.t]||'⭐'}</div>`;
const rng=(a,b,s,v)=>{let o='';for(let n=a;n<=b+1e-9;n+=s)o+=`<option${n==v?' selected':''}>${n}</option>`;return o};

const EN=(x,s,j)=>{const e=by(x.i);return `<div class=e data-ed="${s}:${j}">${im(e)}<div class=i><b>${esc(e.n)}</b><div class=h>${x.s} × ${S.kg[x.i]||0} kg</div><small>series · peso máx.</small></div></div>`};
const mig=()=>{S.kg=S.kg||{};Object.values(S.r).forEach(r=>{r.rep=r.rep||[];r.d.forEach(d=>d.e.forEach(x=>{if(x.k!=null){S.kg[x.i]=Math.max(S.kg[x.i]||0,x.k);delete x.k}}))})};

const eff=()=>{const r=R(),o=[],p=[];let cl=0;r.d.forEach((d,i)=>{if(d.m=='c'){p.push(i);cl=1;o.push({t:'c'})}else if(d.m=='o')o.push({t:'o'});else if(i==4&&cl)o.push({s:'r',t:'rep'});else{p.push(i);const s=p.shift();o.push({s,t:s==i?'n':'sh'})}});return o};

 if(sel=='r'){const l=LS('r');h+=`<div class=d><h3>Día de reemplazo</h3><div class=tg>Reemplaza al viernes cuando hay un día cerrado</div>${l.map((x,j)=>EN(x,'r',j)).join('')||'<div class=em>Sin ejercicios</div>'}<button class=p style="width:100%" data-add="r">+ Agregar ejercicio</button></div>`}if(sel==null)h+=`<div class=em>Hoy es ${WD[new Date().getDay()]}: fin de semana, sin rutina.<br>Elegí un día arriba para verlo.</div>`;const E=eff();R().d.forEach((d,i)=>{if(i!=sel)return;const f=E[i],l=f.s!=null?LS(f.s):[];h+=`<div class="d${d.m=='c'?' c2':d.m=='o'?' o':''}"><h3>${DN[i]}${i==TD?' · Hoy':''}</h3><div class=sg>${[['g','Gym',''],['c','Cerrado','k'],['o','No voy','z']].map(([m,t,k])=>`<button data-m="${i}:${m}" class="${k}${d.m==m?' on':''}">${t}</button>`).join('')}</div>`;
  if(d.m=='o')h+='<div class=em>Día libre 😴<br>Sin entrenamiento</div>';
  else{if(d.m=='c')h+='<div class=tg>Gym cerrado · su rutina se traslada al día siguiente</div>';else if(f.t=='sh')h+=`<div class=tg>Rutina de ${DN[f.s]} (trasladada)</div>`;else if(f.t=='rep')h+='<div class=tg>Día de reemplazo</div>';

function render(){$('#cat').hidden=page!='cat';$('#wk').hidden=page!='wk';$('#cfg').hidden=page!='cfg';$('#bar').style.display=page=='cat'?'flex':'none';page=='cat'?rcat():page=='wk'?rwk():rcfg()}
function ed(i,j){const l0=LS(i),x=l0[j],e=by(x.i);
 dlg.innerHTML=`<h3>${esc(e.n)}</h3><label>Series<select id=es>${rng(1,12,1,x.s)}</select></label><label>Peso máximo alcanzado (kg)<select id=ek>${rng(0,300,2.5,S.kg[x.i]||0)}</select></label><p class=mut style="margin:0 0 8px;font-size:12px">El peso se actualiza en todas las veces que aparece este ejercicio.</p><p><button class=p id=ok>Listo</button><button id=up>▲ Subir</button><button id=dn>▼ Bajar</button><button id=rm style="color:#ff6b6b">Quitar</button></p>`;
 $('#es').onchange=()=>{x.s=+$('#es').value;save();rwk()};$('#ek').onchange=()=>{S.kg[x.i]=+$('#ek').value;save();rwk()};$('#ok').onclick=()=>dlg.close();
 const mv=k=>{const l=l0,n=j+k;if(n<0||n>=l.length)return;[l[j],l[n]]=[l[n],l[j]];save();rwk();dlg.close()};
 $('#up').onclick=()=>mv(-1);$('#dn').onclick=()=>mv(1);$('#rm').onclick=()=>{l0.splice(j,1);save();rwk();dlg.close()};dlg.showModal()}
function pick(i){const l0=LS(i),pre=new Set(l0.map(x=>x.i)),ad={};dlg.className='full';
 dlg.innerHTML=`<div class=hd><h3>Agregar a ${i=='r'?'día de reemplazo':DN[i]}</h3><button id=xx aria-label="Cerrar">✕</button></div><input type=text id=pq placeholder="Buscar…"><select id=pt><option>Todo${Object.keys(TY).map(t=>`<option>${t}`).join('')}</select><div id=pl></div><p><button class=p id=ok>Listo</button></p>`;
 const f=()=>{const q=$('#pq').value.toLowerCase(),t=$('#pt').value;$('#pl').innerHTML=all().filter(e=>(t=='Todo'||e.t==t)&&e.n.toLowerCase().includes(q)).map(e=>`<div class="pr${ad[e.id]?' ok':''}" style="${pre.has(e.id)?'opacity:.45;cursor:default':''}" data-pk="${e.id}">${im(e)}<div><b>${esc(e.n)}</b><small>${e.t}${ad[e.id]?' · agregado ✓ (tocá para quitar)':pre.has(e.id)?' · ya está en el día':''}</small></div></div>`).join('')||'<div class=em>Sin resultados</div>'};
 $('#pq').oninput=f;$('#pt').onchange=f;f();$('#ok').onclick=()=>dlg.close();$('#xx').onclick=()=>dlg.close();
 $('#pl').onclick=ev=>{const r=ev.target.closest('[data-pk]');if(!r)return;const id=r.dataset.pk;if(pre.has(id))return;if(ad[id]){l0.splice(l0.indexOf(ad[id]),1);delete ad[id]}else{ad[id]={i:id,s:3};l0.push(ad[id])}save();rwk();f()};
 dlg.showModal();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function cdlg(id){const e=by(id),cus=S.cx.some(c=>c.id==id);
 dlg.innerHTML=`<h3>${esc(e.n)}</h3><div class=big>${im(e)}</div><p class=mut style="text-align:center;margin:0 0 8px">${e.t}</p>
 <label>Imagen (se guarda en la página)<input type=file id=fi accept="image/*"></label>${(S.img[id]||LI[id])?'<button id=ri style="width:100%;margin-bottom:8px">Quitar imagen</button>':''}
 <label>Día<select id=ad>${DN.map((n,i)=>`<option value=${i}>${n}`).join('')}<option value=r>Día de reemplazo</select></label>
 
 <p><button class=p id=ag>Agregar a la semana</button>${cus?'<button id=dx style="color:#ff6b6b">Borrar ejercicio</button>':''}<button id=cl>Cerrar</button></p>`;
 $('#cl').onclick=()=>dlg.close();
 $('#fi').onchange=async()=>{const f=$('#fi').files[0];if(!f)return;try{const A=window.claude&&await claude.use('assets');
  const bm=await createImageBitmap(f),W=400,H=600,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),r=Math.max(W/bm.width,H/bm.height),w=bm.width*r,h=bm.height*r;x.drawImage(bm,(W-w)/2,(H-h)/2,w,h);
  if(A){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)),u=await A.upload(b);S.img[id]=u.url;save()}else{LI[id]=c.toDataURL('image/jpeg',.8);svI()}render();cdlg(id)}catch(er){msg('No se pudo subir la imagen')}};
 if(S.img[id]||LI[id])$('#ri').onclick=()=>{delete S.img[id];delete LI[id];svI();save();render();cdlg(id)};
 $('#ag').onclick=()=>{const v=$('#ad').value;LS(v=='r'?'r':+v).push({i:id,s:3});save();render();msg('Agregado a '+(v=='r'?'día de reemplazo':DN[+v]))};
 if(cus)$('#dx').onclick=()=>{S.cx=S.cx.filter(c=>c.id!=id);delete S.img[id];delete LI[id];svI();Object.values(S.r).forEach(r=>{r.rep=(r.rep||[]).filter(x=>x.i!=id);r.d.forEach(d=>{d.e=d.e.filter(x=>x.i!=id)})});delete S.kg[id];save();dlg.close();render()};
 dlg.showModal()}
function nx(){dlg.innerHTML=`<h3>Ejercicio propio</h3><label>Nombre<input type=text id=nn></label><label>Tipo<select id=nt>${Object.keys(TY).map(t=>`<option>${t}`).join('')}</select></label><p><button class=p id=ok>Crear</button><button id=cl>Cancelar</button></p>`;
 $('#cl').onclick=()=>dlg.close();$('#ok').onclick=()=>{const n=$('#nn').value.trim();if(!n)return;S.cx.push({id:'c'+Date.now(),n,t:$('#nt').value});save();dlg.close();render()};dlg.showModal()}
const TA='width:100%;background:#120c0c;color:inherit;border:1px solid #3a2222;border-radius:10px;padding:8px';
function exp(){const t=JSON.stringify({v:1,r:S.r,a:S.a,cx:S.cx,kg:S.kg});dlg.innerHTML=`<h3>Exportar datos</h3><p class=mut style="margin:0 0 8px">Copiá el texto o descargalo como archivo. No incluye las imágenes.</p><textarea id=xt readonly style="${TA};height:160px"></textarea><p><button class=p id=dl>Descargar archivo</button><button id=cp>Copiar</button><button id=cl>Cerrar</button></p>`;
 $('#xt').value=t;$('#cl').onclick=()=>dlg.close();
 $('#cp').onclick=()=>{$('#xt').select();try{navigator.clipboard.writeText(t).then(()=>msg('Copiado'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}};
 $('#dl').onclick=async()=>{try{const D=window.claude&&await claude.use('downloads');if(!D)throw 0;await D.save({filename:'rutina-gym.json',data:t})}catch(e){msg('Descarga no disponible: copiá el texto')}};dlg.showModal()}
function imp(){dlg.innerHTML=`<h3>Importar datos</h3><p class=mut style="margin:0 0 8px">Reemplaza tus rutinas actuales. Elegí un archivo o pegá el texto.</p><input type=file id=if accept=".json,application/json"><textarea id=it placeholder="O pegá aquí el texto exportado" style="${TA};height:120px;margin-top:8px"></textarea><p><button class=p id=ok>Importar</button><button id=cl>Cancelar</button></p>`;
 $('#cl').onclick=()=>dlg.close();$('#if').onchange=async()=>{const f=$('#if').files[0];if(f)$('#it').value=await f.text()};
 $('#ok').onclick=()=>{try{const o=JSON.parse($('#it').value);if(!o.r||!Object.keys(o.r).length||!Object.values(o.r).every(r=>Array.isArray(r.d)&&r.d.length==5))throw 0;S={...S,r:o.r,a:o.r[o.a]?o.a:Object.keys(o.r)[0],cx:Array.isArray(o.cx)?o.cx:[],kg:o.kg||{}};mig();save();dlg.close();render();msg('Datos importados')}catch(e){msg('Archivo o texto no válido')}};dlg.showModal()}
function menu(){$('#sp').innerHTML=`<h3>Rutinas</h3><select id=rs>${Object.keys(S.r).map(k=>`<option${k==S.a?' selected':''}>${esc(k)}`).join('')}</select><button class=p data-a=new>+ Nueva rutina</button><button data-a=dup>Duplicar</button><button data-a=ren>Renombrar</button><button data-a=del>Borrar</button><hr><button data-a=rep>Día de reemplazo</button><button data-a=cls>Cerrar</button>`;$('#sb').hidden=false}
function nm(a){const t={new:'Nueva rutina',dup:'Duplicar rutina',ren:'Renombrar rutina'}[a];
 dlg.innerHTML=`<h3>${t}</h3><label>Nombre<input type=text id=nn value="${a=='ren'?esc(S.a):''}" placeholder="Ej: Rutina B, Hipertrofia…"></label><p><button class=p id=ok>Aceptar</button><button id=cl>Cancelar</button></p>`;
 $('#cl').onclick=()=>dlg.close();$('#ok').onclick=()=>{const n=$('#nn').value.trim();if(!n)return;if(S.r[n]&&!(a=='ren'&&n==S.a)){msg('Ya existe ese nombre');return}
  if(a=='ren'){const o={};for(const k in S.r)o[k==S.a?n:k]=S.r[k];S.r=o}else S.r[n]=a=='dup'?JSON.parse(JSON.stringify(R())):nr();S.a=n;save();dlg.close();render()};dlg.showModal()}
function cf(txt,fn){dlg.innerHTML=`<h3>${txt}</h3><p><button class=p id=ok style="background:#b3121f">Confirmar</button><button id=cl>Cancelar</button></p>`;$('#cl').onclick=()=>dlg.close();$('#ok').onclick=()=>{fn();save();dlg.close();render()};dlg.showModal()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-p],[data-k],[data-a],[data-m],[data-add],[data-ed],[data-sd]');if(!t)return;const D=t.dataset;if(t.closest('#sb')){$('#sb').hidden=true;if(D.a=='cls')return}
 if(D.p){page=D.p;document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('on',b==t));render()}
 else if(D.sd!=null){sel=+D.sd;pk=1;rwk()}else if(D.k)cdlg(D.k);else if(D.ed){const[a,b]=D.ed.split(':');ed(a=='r'?'r':+a,+b)}else if(D.add!=null)pick(D.add=='r'?'r':+D.add);
 else if(D.m){const[i,m]=D.m.split(':');R().d[+i].m=m;save();rwk()}
 else if(D.a=='menu')menu();else if(D.a=='rep'){sel='r';pk=1;rwk()}
 else if(D.a=='exp')exp();else if(D.a=='imp')imp();else if(D.a=='nx')nx();else if(['new','dup','ren'].includes(D.a))nm(D.a);
 else if(D.a=='del'){if(Object.keys(S.r).length<2){msg('Tiene que quedar al menos una rutina');return}cf(`¿Borrar «${esc(S.a)}»?`,()=>{delete S.r[S.a];S.a=Object.keys(S.r)[0]})}
 else if(D.a=='rst')cf('¿Restablecer todo? No se puede deshacer.',()=>{S=def()})});
document.addEventListener('change',e=>{if(e.target.id=='rs'){S.a=e.target.value;save();$('#sb').hidden=true;rwk()}else if(e.target.id=='ty')rcat()});
let sx=0;$('#wk').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});$('#wk').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70&&!dlg.open){sel=Math.min(4,Math.max(0,(typeof sel!='number'?(dx<0?-1:5):sel)+(dx<0?1:-1)));pk=1;rwk()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=TDf();if(t!=TD){TD=t;if(!pk)sel=t<5?t:null;if(page=='wk')rwk()}}});
try{const l=localStorage.getItem('gym-s');if(l){S={...def(),...JSON.parse(l)};mig()}}catch(e){}dlg.addEventListener('close',()=>dlg.className='');$('#q').oninput=rcat;$('#ty').innerHTML='<option>Todo'+Object.keys(TY).map(t=>`<option>${t}`).join('');
render();
(async()=>{try{const db=window.claude&&await claude.use('db');if(!db){rcfg();return}doc=db.doc('gym/state');const s=await doc.get();if(s.exists&&s.data().j){S={...def(),...JSON.parse(s.data().j)};mig();try{localStorage.setItem('gym-s',JSON.stringify(S))}catch(e){}}else save()}catch(er){doc=null}render()})();
</script></body></html>
